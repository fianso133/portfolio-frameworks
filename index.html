<!doctype html>
<html lang="da" style="background:#121212; color:#F1F1F1;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio – Framework Sammenligning</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 96px 24px;
      }

      .grid {
        display: grid;
        gap: 32px;
      }

      @media (min-width: 768px) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .card {
        background: #1E1E1E;
        border: 1px solid #2A2A2A;
        border-radius: 6px;
        text-decoration: none;
        color: #F1F1F1;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: border-color 150ms ease;
      }

      .card:hover {
        border-color: #4C8BF5;
      }

      .card h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        text-align: center;
      }

      h1 {
        font-size: 32px;
        font-weight: 600;
        margin-bottom: 64px;
      }
    </style>
  </head>

  <body>
    <div class="container">

      <h1>Framework-sammenligning</h1>

      <div class="grid">

        <a href="tailwind.html" class="card">
          <h2>Tailwind CSS</h2>
        </a>

        <a href="bootstrap.html" class="card">
          <h2>Bootstrap</h2>
        </a>

        <a href="bulma.html" class="card">
          <h2>Bulma</h2>
        </a>

      </div>

    </div>
  </body>
</html>
